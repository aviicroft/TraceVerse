<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACEVERSE — Judge Documentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        :root {
            --bg: #0B1736;
            --bg2: #102347;
            --bg3: #162D55;
            --bg4: #1C3763;
            --line: #29436B;
            --line2: #1D355A;
            --txt: #F8FAFC;
            --dim: #CBD5E1;
            --faint: #94A3B8;
            --acc: #E63946;
            --acc-bg: rgba(230, 57, 70, .12);
            --ok: #22C55E;
            --ok-bg: rgba(34, 197, 94, .12);
            --warn: #F59E0B;
            --err: #EF4444;
            --err-bg: rgba(239, 68, 68, .12);
            --info: #38BDF8;
            --info-bg: rgba(56, 189, 248, .12);
            --sans: 'Inter', 'IBM Plex Sans', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
            --sbw: 264px;
            --railw: 224px;
            --headh: 52px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth;
            background: #0B1736;
        }

        body {
            background: var(--bg);
            color: var(--txt);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.6;
            background-image: radial-gradient(rgba(41, 67, 107, .3) 1px, transparent 1px);
            background-size: 26px 26px
        }

        ::selection {
            background: rgba(230, 57, 70, .25);
            color: #FFFFFF;
        }

        a {
            color: var(--acc);
            text-decoration: none
        }

        button {
            font-family: inherit;
            cursor: pointer
        }

        svg.lucide {
            width: 14px;
            height: 14px;
            stroke-width: 1.8;
            vertical-align: -2px
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px
        }

        ::-webkit-scrollbar-thumb {
            background: #29436B;
            border-radius: 4px;
            border: 2px solid var(--bg)
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3C5C89
        }

        ::-webkit-scrollbar-track {
            background: #0B1736
        }

        .mono {
            font-family: var(--mono)
        }

        /* ============ HEADER ============ */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--headh);
            z-index: 60;
            background: rgba(16, 35, 71, .95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px
        }

        #burger {
            display: none;
            background: none;
            border: 1px solid var(--line2);
            color: var(--dim);
            padding: 6px 8px;
            border-radius: 4px
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-right: 6px;
            white-space: nowrap
        }

        .brand b {
            font-weight: 700;
            letter-spacing: .06em;
            font-size: 13.5px;
            color: #F8FAFC
        }

        .brand span {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--dim);
            letter-spacing: .12em
        }

        .crumb-mid {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--faint);
            letter-spacing: .1em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .hspace {
            flex: 1
        }

        .hbtn {
            background: var(--bg2);
            border: 1px solid var(--line2);
            color: var(--dim);
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: .08em;
            padding: 7px 11px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: .15s
        }

        .hbtn:hover {
            color: var(--txt);
            border-color: #3C5C89;
            background: var(--bg3);
        }

        .hbtn kbd {
            font-family: var(--mono);
            font-size: 9px;
            border: 1px solid var(--line2);
            border-radius: 3px;
            padding: 1px 4px;
            color: var(--faint)
        }

        .hbtn.accent {
            color: #FFFFFF;
            background: var(--acc);
            border-color: var(--acc)
        }

        .hbtn.accent:hover {
            background: #F04B56;
            border-color: #F04B56
        }

        .sysbadge {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 1px solid var(--line);
            padding-left: 14px;
            margin-left: 4px
        }

        .sysbadge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--warn);
            animation: pulse 2.4s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, .4)
            }

            50% {
                box-shadow: 0 0 0 5px rgba(245, 158, 11, 0)
            }
        }

        .sysbadge div {
            line-height: 1.25
        }

        .sysbadge .l1 {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .14em;
            color: var(--dim)
        }

        .sysbadge .l2 {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .14em;
            color: var(--warn)
        }

        .jtoggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: 1px solid var(--line2);
            border-radius: 4px;
            padding: 6px 10px;
            color: var(--dim);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .1em;
            transition: .15s
        }

        .jtoggle .sw {
            width: 26px;
            height: 14px;
            border-radius: 8px;
            border: 1px solid var(--line2);
            position: relative;
            transition: .2s
        }

        .jtoggle .sw::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dim);
            top: 2px;
            left: 3px;
            transition: .2s
        }

        body.judge .jtoggle {
            color: var(--acc);
            border-color: rgba(230, 57, 70, .45)
        }

        body.judge .jtoggle .sw {
            border-color: var(--acc);
            background: var(--acc-bg)
        }

        body.judge .jtoggle .sw::after {
            left: 13px;
            background: var(--acc)
        }

        /* judge strip */
        #jstrip {
            display: none;
            position: fixed;
            top: var(--headh);
            left: 0;
            right: 0;
            z-index: 55;
            background: #102347;
            border-bottom: 1px solid rgba(230, 57, 70, .25);
            padding: 7px 16px;
            gap: 8px;
            align-items: center;
            overflow-x: auto
        }

        body.judge #jstrip {
            display: flex
        }

        #jstrip .jl {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .16em;
            color: var(--acc);
            white-space: nowrap;
            margin-right: 4px
        }

        #jstrip button {
            background: none;
            border: 1px solid rgba(230, 57, 70, .3);
            color: var(--warn);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .06em;
            padding: 4px 10px;
            border-radius: 3px;
            white-space: nowrap
        }

        #jstrip button:hover {
            background: var(--acc-bg)
        }

        body.judge #shell {
            padding-top: 36px
        }

        /* ============ SHELL ============ */
        #shell {
            display: block;
            padding-top: var(--headh)
        }

        #sidebar {
            position: fixed;
            top: var(--headh);
            bottom: 0;
            left: 0;
            width: var(--sbw);
            border-right: 1px solid var(--line);
            background: var(--bg2);
            overflow-y: auto;
            z-index: 40;
            display: flex;
            flex-direction: column
        }

        .sb-brand {
            padding: 18px 18px 14px;
            border-bottom: 1px solid var(--line)
        }

        .sb-brand .t1 {
            font-weight: 700;
            letter-spacing: .14em;
            font-size: 14px;
            color: #E7EBEF
        }

        .sb-brand .t2 {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--dim);
            letter-spacing: .14em;
            margin-top: 2px
        }

        .sb-nav {
            flex: 1;
            padding: 8px 0 20px
        }

        .sb-group {
            margin-top: 14px
        }

        .sb-group>div {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .2em;
            color: var(--faint);
            padding: 5px 18px
        }

        .sb-item {
            display: flex;
            gap: 9px;
            align-items: baseline;
            padding: 4.5px 18px;
            color: var(--dim);
            font-size: 12.5px;
            border-left: 2px solid transparent;
            transition: .12s
        }

        .sb-item .n {
            font-family: var(--mono);
            font-size: 9.5px;
            color: var(--faint);
            min-width: 18px
        }

        .sb-item:hover {
            color: var(--txt);
            background: rgba(255, 255, 255, .02)
        }

        .sb-item.active {
            color: #F8FAFC;
            border-left-color: var(--acc);
            background: rgba(230, 57, 70, .10)
        }

        .sb-item.active .n {
            color: var(--acc)
        }

        .sb-foot {
            border-top: 1px solid var(--line);
            padding: 10px 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px
        }

        .sb-foot button {
            background: none;
            border: 1px solid var(--line2);
            color: var(--dim);
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .08em;
            padding: 7px 6px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px
        }

        .sb-foot button:hover {
            color: var(--acc);
            border-color: rgba(230, 57, 70, .4);
            background: var(--acc-bg);
        }

        #main {
            margin-left: var(--sbw);
            margin-right: var(--railw);
            padding: 30px 40px 140px;
            position: relative
        }

        #content {
            max-width: 880px;
            margin: 0 auto
        }

        /* right rail */
        #rail {
            position: fixed;
            top: var(--headh);
            right: 0;
            bottom: 0;
            width: var(--railw);
            background: var(--bg);
            border-left: 1px solid var(--line);
            padding: 24px 18px 40px;
            overflow-y: auto;
            z-index: 20
        }

        .rail-t {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .18em;
            color: var(--faint);
            margin-bottom: 12px
        }

        .rail-item {
            display: block;
            font-size: 11.5px;
            color: var(--dim);
            padding: 3.5px 0 3.5px 12px;
            border-left: 1px solid var(--line);
            transition: .12s;
            line-height: 1.4
        }

        .rail-item:hover {
            color: var(--txt)
        }

        .rail-item.active {
            color: var(--acc);
            border-left-color: var(--acc)
        }

        .rail-note {
            margin-top: 26px;
            border-top: 1px solid var(--line);
            padding-top: 14px;
            font-size: 10.5px;
            color: var(--faint);
            line-height: 1.6
        }

        /* ============ PAGE HEAD ============ */
        .crumbs {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .14em;
            color: var(--faint);
            margin-bottom: 14px
        }

        .crumbs b {
            color: var(--dim);
            font-weight: 500
        }

        .page-head {
            border-bottom: 1px solid var(--line);
            padding-bottom: 20px;
            margin-bottom: 8px;
            position: relative
        }

        .page-head .row1 {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap
        }

        .page-head h1 {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: .03em;
            color: #F8FAFC;
            line-height: 1.2;
            flex: 1;
            min-width: 220px
        }

        .copylink {
            background: var(--bg2);
            border: 1px solid var(--line2);
            color: var(--dim);
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .1em;
            padding: 6px 10px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap
        }

        .copylink:hover {
            color: var(--acc);
            border-color: rgba(230, 57, 70, .4);
            background: var(--acc-bg);
        }

        .page-kick {
            color: var(--dim);
            font-size: 14px;
            margin-top: 10px;
            max-width: 680px
        }

        .page-meta {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap
        }

        /* badges */
        .bd {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .12em;
            padding: 2.5px 8px;
            border-radius: 3px;
            border: 1px solid;
            white-space: nowrap
        }

        .bd-impl {
            color: var(--ok);
            border-color: rgba(99, 176, 134, .4);
            background: var(--ok-bg)
        }

        .bd-exp {
            color: var(--warn);
            border-color: rgba(217, 160, 80, .4);
            background: rgba(217, 160, 80, .08)
        }

        .bd-mock {
            color: #9AA3AD;
            border-color: #3A424B;
            background: rgba(154, 163, 173, .07)
        }

        .bd-plan {
            color: #8FA3BE;
            border-color: rgba(143, 163, 190, .35);
            background: rgba(143, 163, 190, .07)
        }

        .bd-doc {
            color: var(--dim);
            border-color: var(--line2);
            background: transparent
        }

        /* ============ SECTIONS / CONTENT ============ */
        .sec {
            margin-top: 38px;
            scroll-margin-top: 70px
        }

        .sh {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 8px;
            margin-bottom: 16px
        }

        .sh h2 {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .18em;
            color: #DFE4E9
        }

        .sh .tag {
            margin-left: auto
        }

        .anc {
            background: none;
            border: none;
            color: var(--faint);
            opacity: 0;
            transition: .15s;
            padding: 2px
        }

        .anc:hover {
            color: var(--acc)
        }

        .sh:hover .anc {
            opacity: 1
        }

        .sec p {
            margin: 10px 0;
            color: #B8BFC7;
            max-width: 760px
        }

        .sec p b {
            color: #E4E8EC;
            font-weight: 600
        }

        .sec ul {
            margin: 10px 0 10px 18px;
            color: #B8BFC7;
            max-width: 740px
        }

        .sec ul li {
            margin: 5px 0
        }

        .sec ul li::marker {
            color: var(--acc)
        }

        code.inline {
            font-family: var(--mono);
            font-size: 12px;
            background: var(--bg3);
            border: 1px solid var(--line);
            padding: 1px 6px;
            border-radius: 3px;
            color: #D8DEE4
        }

        /* judge focus panel */
        .judge-panel {
            display: none;
            border: 1px solid rgba(230, 57, 70, .35);
            background: rgba(230, 57, 70, .06);
            padding: 16px 18px;
            margin-top: 22px;
            border-radius: 4px
        }

        body.judge .judge-panel {
            display: block
        }

        .judge-panel .jt {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .18em;
            color: var(--acc);
            margin-bottom: 8px
        }

        .judge-panel p {
            color: #CBD5E1;
            font-size: 13px;
            margin: 0 0 10px
        }

        body.judge #content {
            font-size: 13.5px
        }

        /* flow (vertical) */
        .flow {
            margin: 16px 0;
            max-width: 640px
        }

        .fstep {
            display: flex;
            gap: 14px;
            position: relative;
            padding: 0 0 4px
        }

        .fstep .fi {
            font-family: var(--mono);
            font-size: 9.5px;
            color: var(--acc);
            min-width: 44px;
            padding-top: 9px;
            letter-spacing: .08em
        }

        .fstep .fb {
            flex: 1;
            border: 1px solid var(--line);
            background: var(--bg2);
            border-radius: 4px;
            padding: 8px 13px;
            transition: .15s
        }

        .fstep .fb.nav {
            cursor: pointer
        }

        .fstep .fb.nav:hover {
            border-color: rgba(230, 57, 70, .5);
            background: var(--bg3)
        }

        .fstep .fk {
            font-family: var(--mono);
            font-size: 11.5px;
            letter-spacing: .1em;
            color: #DFE4E9
        }

        .fstep .fv {
            font-size: 12px;
            color: var(--dim);
            margin-top: 1px
        }

        .fstep .fa {
            color: var(--faint);
            align-self: center;
            padding: 2px 0 8px
        }

        .farrow {
            color: #3A424B;
            font-family: var(--mono);
            padding-left: 58px;
            margin: 2px 0;
            font-size: 11px
        }

        /* horizontal chain */
        .chain {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
            margin: 18px 0
        }

        .cstep {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: .06em;
            color: #D5DBE1;
            background: var(--bg2);
            border: 1px solid var(--line2);
            padding: 8px 11px;
            border-radius: 3px;
            transition: .15s
        }

        .cstep.nav {
            cursor: pointer
        }

        .cstep.nav:hover {
            border-color: var(--acc);
            color: var(--acc)
        }

        .carr {
            color: #3E464F;
            font-size: 11px
        }

        /* tables */
        .tw {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 4px;
            margin: 14px 0
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px
        }

        th {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .14em;
            color: var(--faint);
            text-align: left;
            padding: 9px 13px;
            border-bottom: 1px solid var(--line2);
            background: var(--bg2);
            white-space: nowrap
        }

        td {
            padding: 9px 13px;
            border-bottom: 1px solid var(--line);
            color: #B8BFC7;
            vertical-align: top
        }

        tr:last-child td {
            border-bottom: none
        }

        tbody tr:hover td {
            background: rgba(255, 255, 255, .015)
        }

        td.mono-cell {
            font-family: var(--mono);
            font-size: 11.5px;
            color: #CDD4DB
        }

        td b {
            color: #E4E8EC
        }

        /* code blocks */
        .code {
            border: 1px solid var(--line);
            border-radius: 4px;
            margin: 14px 0;
            background: #08142F;
            overflow: hidden
        }

        .ch {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-bottom: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .16em;
            color: var(--faint);
            background: var(--bg2)
        }

        .cb {
            background: none;
            border: none;
            color: var(--faint)
        }

        .cb:hover {
            color: var(--acc)
        }

        .code pre {
            padding: 14px 16px;
            overflow-x: auto
        }

        .code code {
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.65;
            color: #C4CCD4;
            white-space: pre
        }

        /* notices */
        .notice {
            border: 1px solid;
            border-radius: 4px;
            padding: 13px 16px;
            margin: 16px 0;
            display: flex;
            gap: 12px;
            align-items: flex-start
        }

        .notice .nt {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: .12em;
            margin-bottom: 3px
        }

        .notice p {
            font-size: 12.5px;
            margin: 0 !important;
            color: #B8BFC7
        }

        .notice.info {
            border-color: rgba(129, 149, 171, .35);
            background: var(--info-bg)
        }

        .notice.info .nt {
            color: var(--info)
        }

        .notice.warn {
            border-color: rgba(217, 160, 80, .4);
            background: rgba(217, 160, 80, .06)
        }

        .notice.warn .nt {
            color: var(--warn)
        }

        .notice.limit {
            border-color: rgba(201, 106, 95, .4);
            background: var(--err-bg)
        }

        .notice.limit .nt {
            color: var(--err)
        }

        .notice.ok {
            border-color: rgba(99, 176, 134, .4);
            background: var(--ok-bg)
        }

        .notice.ok .nt {
            color: var(--ok)
        }

        /* implementation card */
        .impl-card {
            border: 1px solid var(--line2);
            border-radius: 4px;
            margin: 16px 0;
            background: var(--bg2);
            overflow: hidden
        }

        .impl-card .ih {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--bg3)
        }

        .impl-card .ih b {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: .18em;
            color: #DFE4E9
        }

        .impl-card .ih .tag {
            margin-left: auto
        }

        .impl-row {
            display: flex;
            border-bottom: 1px solid var(--line);
            font-size: 12.5px
        }

        .impl-row:last-of-type {
            border-bottom: none
        }

        .impl-row .k {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .14em;
            color: var(--faint);
            width: 150px;
            padding: 9px 16px;
            flex-shrink: 0;
            border-right: 1px solid var(--line)
        }

        .impl-row .v {
            padding: 9px 16px;
            color: #BCC3CB
        }

        .impl-card .if {
            padding: 10px 16px;
            border-top: 1px solid var(--line);
            display: flex;
            gap: 8px
        }

        /* buttons & chips */
        .btn {
            background: var(--bg2);
            border: 1px solid var(--line2);
            color: #C9CFD6;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .1em;
            padding: 7px 13px;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: .15s
        }

        .btn:hover {
            border-color: #3E464F;
            color: #E4E8EC
        }

        .btn.primary {
            color: #FFFFFF;
            background: var(--acc);
            border-color: var(--acc)
        }

        .btn.primary:hover {
            background: var(--acc-h);
            border-color: var(--acc-h);
            color: #FFFFFF
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0
        }

        .chip {
            background: var(--bg2);
            border: 1px solid var(--line2);
            color: var(--dim);
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: .06em;
            padding: 6px 12px;
            border-radius: 3px;
            transition: .15s;
            text-align: left
        }

        .chip:hover {
            color: var(--acc);
            border-color: rgba(230, 57, 70, .45)
        }

        .chip.q::before {
            content: 'Q ';
            color: var(--acc)
        }

        /* kv grid */
        .kv {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            border-radius: 4px;
            overflow: hidden;
            margin: 14px 0
        }

        .kv>div {
            background: var(--bg2);
            padding: 11px 15px
        }

        .kv .k {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .14em;
            color: var(--faint);
            margin-bottom: 3px
        }

        .kv .v {
            font-size: 13px;
            color: #CDD4DB
        }

        .kv .v.mono {
            font-size: 12px
        }

        /* what-it-does cards (compact 2x2) */
        .wcards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0
        }

        .wcard {
            background: var(--bg2);
            padding: 16px 18px
        }

        .wcard .wt {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .18em;
            color: var(--acc);
            margin-bottom: 6px
        }

        .wcard p {
            font-size: 12.5px;
            color: #B0B8C0;
            margin: 0;
            max-width: none
        }

        .wcard .wl {
            margin-top: 10px
        }

        /* three-column status split */
        .split3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0
        }

        .split3>div {
            background: var(--bg2);
            padding: 14px 16px
        }

        .split3 .h {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .14em
        }

        .split3 ul {
            margin: 0 0 0 14px
        }

        .split3 li {
            font-size: 12px;
            margin: 4px 0;
            color: #AEB6BE
        }

        /* evidence cards */
        .evcard {
            border: 1px solid var(--line);
            border-radius: 4px;
            margin: 10px 0;
            background: var(--bg2)
        }

        .evhead {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            cursor: pointer;
            user-select: none
        }

        .evhead:hover {
            background: var(--bg3)
        }

        .evhead .eid {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--acc);
            letter-spacing: .06em;
            min-width: 62px
        }

        .evhead .ehash {
            font-family: var(--mono);
            font-size: 11px;
            color: #C4CCD4;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .evhead .chev {
            color: var(--faint);
            transition: .2s
        }

        .evcard.open .chev {
            transform: rotate(90deg)
        }

        .evbody {
            display: none;
            border-top: 1px solid var(--line);
            padding: 13px 15px
        }

        .evcard.open .evbody {
            display: block
        }

        .evgrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px 22px;
            margin-bottom: 12px
        }

        .evgrid .k {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .14em;
            color: var(--faint)
        }

        .evgrid .v {
            font-family: var(--mono);
            font-size: 11.5px;
            color: #CDD4DB;
            margin-top: 2px;
            word-break: break-all
        }

        .evactions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        /* faq */
        .fitem {
            border: 1px solid var(--line);
            border-radius: 4px;
            margin: 8px 0;
            background: var(--bg2);
            scroll-margin-top: 80px
        }

        .fq {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: #D5DBE1;
            padding: 12px 15px;
            font-size: 13.5px;
            font-weight: 500
        }

        .fq:hover {
            color: var(--acc)
        }

        .fq .fcat {
            font-family: var(--mono);
            font-size: 8.5px;
            letter-spacing: .12em;
            color: var(--faint);
            border: 1px solid var(--line2);
            padding: 2px 7px;
            border-radius: 3px;
            flex-shrink: 0;
            min-width: 100px;
            text-align: center
        }

        .fq .chev {
            margin-left: auto;
            color: var(--faint);
            transition: .2s;
            flex-shrink: 0
        }

        .fitem.open .chev {
            transform: rotate(90deg)
        }

        .fa-body {
            display: none;
            border-top: 1px solid var(--line);
            padding: 14px 16px
        }

        .fitem.open .fa-body {
            display: block
        }

        .fa-body p {
            color: #B4BCC4;
            font-size: 13px;
            margin: 0 0 10px
        }

        .fq-target {
            scroll-margin-top: 80px
        }

        /* rapid cards */
        .rapid {
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg2);
            margin: 0;
            overflow: hidden
        }

        .rrow {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid var(--line);
            padding: 15px 18px;
            color: inherit;
            text-align: left;
            transition: .12s
        }

        .rrow:last-child {
            border-bottom: none
        }

        .rrow:hover {
            background: var(--bg3)
        }

        .rrow .rn {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--acc);
            min-width: 26px
        }

        .rrow .rq {
            font-size: 13.5px;
            font-weight: 600;
            color: #DDE2E7;
            flex: 1;
            letter-spacing: .02em
        }

        .rrow .ra {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--faint);
            letter-spacing: .08em;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap
        }

        /* system map */
        .mapwrap {
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #08142F;
            margin: 16px 0;
            overflow: hidden
        }

        .mapinner {
            display: grid;
            grid-template-columns: 1fr 250px
        }

        .mapsvg {
            display: block;
            width: 100%;
            height: auto
        }

        .mnode {
            cursor: pointer
        }

        .mnode rect {
            fill: var(--bg3);
            stroke: var(--line);
            stroke-width: 1;
            transition: .15s
        }

        .mnode text {
            fill: #CBD5E1;
            font-family: var(--mono);
            font-size: 11.5px;
            letter-spacing: .06em
        }

        .mnode .sub {
            fill: var(--faint);
            font-size: 8.5px;
            letter-spacing: .14em
        }

        .mnode:hover rect,
        .mnode:focus rect {
            stroke: var(--acc);
            fill: rgba(230, 57, 70, .18)
        }

        .mnode:focus {
            outline: none
        }

        .medge {
            stroke: #29436B;
            stroke-width: 1.2;
            fill: none
        }

        .mflow {
            stroke-dasharray: 3 5;
            animation: dashmove 2.2s linear infinite;
            stroke: rgba(230, 57, 70, .4);
            stroke-width: 1.2;
            fill: none
        }

        @keyframes dashmove {
            to {
                stroke-dashoffset: -16
            }
        }

        .mapinsp {
            border-left: 1px solid var(--line);
            padding: 16px;
            background: var(--bg2)
        }

        .mapinsp .mi-t {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .14em;
            color: var(--acc);
            min-height: 16px;
            margin-bottom: 10px
        }

        .mapinsp .mi-r {
            margin-bottom: 9px
        }

        .mapinsp .mi-k {
            font-family: var(--mono);
            font-size: 8.5px;
            letter-spacing: .16em;
            color: var(--faint)
        }

        .mapinsp .mi-v {
            font-size: 11.5px;
            color: #B8BFC7;
            line-height: 1.45;
            margin-top: 1px
        }

        @media(max-width:1100px) {
            .mapinner {
                grid-template-columns: 1fr
            }

            .mapinsp {
                border-left: none;
                border-top: 1px solid var(--line)
            }
        }

        /* BFS viz */
        .bfswrap {
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #08142F;
            margin: 16px 0;
            overflow: hidden
        }

        .bfs-svg {
            width: 100%;
            height: auto;
            display: block
        }

        .bn rect {
            fill: var(--bg3);
            stroke: var(--line);
            transition: .3s
        }

        .bn text {
            fill: #CBD5E1;
            font-family: var(--mono);
            font-size: 10.5px
        }

        .bn .bsub {
            fill: var(--faint);
            font-size: 8px;
            letter-spacing: .12em
        }

        .bn.act rect {
            stroke: var(--acc);
            fill: rgba(230, 57, 70, .2)
        }

        .bn.done rect {
            stroke: rgba(34, 197, 94, .55)
        }

        .bn.hit rect {
            stroke: var(--ok);
            fill: rgba(34, 197, 94, .15)
        }

        .bn.hit .btag {
            fill: var(--ok)
        }

        .btag {
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: .1em;
            fill: transparent
        }

        .be {
            stroke: #29436B;
            stroke-width: 1.3;
            fill: none;
            transition: .3s
        }

        .be.traced {
            stroke: var(--acc);
            stroke-width: 1.8
        }

        .be.traced.lbl {
            fill: rgba(230, 57, 70, .85)
        }

        .belabel {
            font-family: var(--mono);
            font-size: 8.5px;
            fill: #94A3B8
        }

        .bfsctl {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            border-top: 1px solid var(--line);
            flex-wrap: wrap;
            background: var(--bg2)
        }

        .stepchip {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .06em;
            background: none;
            border: 1px solid var(--line2);
            color: var(--dim);
            padding: 4px 10px;
            border-radius: 3px;
            transition: .15s
        }

        .stepchip:hover {
            color: var(--txt)
        }

        .stepchip.on {
            color: var(--acc);
            border-color: rgba(230, 57, 70, .55);
            background: var(--acc-bg)
        }

        .bfsstate {
            border-top: 1px solid var(--line);
            padding: 12px 15px;
            font-family: var(--mono);
            font-size: 11px;
            line-height: 1.9;
            background: #08142F;
            color: #CBD5E1
        }

        .bfsstate b {
            color: var(--faint);
            font-weight: 500;
            display: inline-block;
            min-width: 96px
        }

        .bfsstate .hl {
            color: var(--acc)
        }

        /* architecture diagram */
        .archgrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            align-items: stretch;
            margin: 16px 0
        }

        .acol {
            border: 1px solid var(--line2);
            border-radius: 4px;
            background: var(--bg2);
            padding: 13px 12px;
            cursor: pointer;
            transition: .15s;
            position: relative
        }

        .acol:hover {
            border-color: rgba(230, 57, 70, .5)
        }

        .acol.sel {
            border-color: var(--acc);
            background: rgba(230, 57, 70, .14)
        }

        .acol .at {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .12em;
            color: #DFE4E9;
            line-height: 1.5
        }

        .acol .as {
            font-size: 10.5px;
            color: var(--faint);
            margin-top: 6px;
            line-height: 1.5
        }

        .acol .al {
            position: absolute;
            top: 9px;
            right: 9px
        }

        .archdetail {
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg2);
            padding: 16px 18px;
            margin-top: 14px
        }

        .archdetail .ad-t {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .16em;
            color: var(--acc);
            margin-bottom: 10px
        }

        .archdetail .ad-row {
            display: flex;
            gap: 14px;
            padding: 6px 0;
            border-bottom: 1px solid var(--line);
            font-size: 12.5px
        }

        .archdetail .ad-row:last-child {
            border-bottom: none
        }

        .archdetail .ad-k {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .14em;
            color: var(--faint);
            width: 130px;
            flex-shrink: 0;
            padding-top: 2px
        }

        .archdetail .ad-v {
            color: #B8BFC7
        }

        @media(max-width:900px) {
            .archgrid {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        /* graph viz (graph engine) */
        .gv-node {
            cursor: pointer
        }

        .gv-node rect {
            fill: var(--bg3);
            stroke: var(--line);
            transition: .15s
        }

        .gv-node:hover rect {
            stroke: var(--line-hover)
        }

        .gv-node.sel rect {
            stroke: var(--acc);
            fill: rgba(230, 57, 70, .18)
        }

        .gv-node text {
            fill: #CBD5E1;
            font-family: var(--mono);
            font-size: 10px
        }

        .gv-edge {
            stroke: var(--line);
            stroke-width: 1.2;
            fill: none;
            cursor: pointer;
            transition: .15s
        }

        .gv-edge:hover {
            stroke: var(--line-hover)
        }

        .gv-edge.sel {
            stroke: var(--acc);
            stroke-width: 1.8
        }

        .gv-det {
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg2);
            padding: 14px 16px;
            margin-top: 12px;
            font-family: var(--mono);
            font-size: 11.5px;
            line-height: 1.9;
            color: #B8BFC7;
            min-height: 96px
        }

        .gv-det b {
            color: var(--faint);
            font-weight: 500;
            display: inline-block;
            min-width: 110px
        }

        .gv-det .sel {
            color: var(--acc)
        }

        /* demo route */
        .route {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin: 20px 0
        }

        .rstep {
            border: 1px solid var(--line2);
            border-radius: 4px;
            background: var(--bg2);
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: .15s
        }

        .rstep:hover {
            border-color: var(--acc)
        }

        .rstep .rn {
            font-family: var(--mono);
            font-size: 16px;
            color: var(--acc);
            font-weight: 600
        }

        .rstep .rt {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .12em;
            color: #DFE4E9;
            margin-top: 6px
        }

        .rstep .rs {
            font-size: 9.5px;
            color: var(--faint);
            margin-top: 4px;
            font-family: var(--mono)
        }

        @media(max-width:900px) {
            .route {
                grid-template-columns: repeat(3, 1fr)
            }
        }

        /* cheat sheet */
        .cheat {
            border: 1px solid var(--line2);
            border-radius: 4px;
            overflow: hidden;
            margin: 18px 0
        }

        .crow {
            display: flex;
            border-bottom: 1px solid var(--line);
            background: var(--bg2)
        }

        .crow:last-child {
            border-bottom: none
        }

        .crow .ck {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: .1em;
            color: var(--acc);
            width: 170px;
            flex-shrink: 0;
            padding: 13px 16px;
            border-right: 1px solid var(--line);
            background: var(--bg3)
        }

        .crow .cv {
            padding: 13px 16px;
            font-size: 13px;
            color: #C2C9D0
        }

        /* report preview */
        .report {
            border: 1px solid var(--line2);
            border-radius: 4px;
            background: #08142F;
            overflow: hidden;
            margin: 16px 0
        }

        .report .rh {
            padding: 11px 16px;
            border-bottom: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .18em;
            color: var(--acc);
            background: var(--bg2);
            display: flex;
            justify-content: space-between
        }

        .report .rsec {
            padding: 11px 16px;
            border-bottom: 1px solid var(--line)
        }

        .report .rsec:last-child {
            border-bottom: none
        }

        .report .rk {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .16em;
            color: var(--faint);
            margin-bottom: 4px
        }

        .report .rv {
            font-family: var(--mono);
            font-size: 11.5px;
            color: #C4CCD4;
            line-height: 1.7
        }

        /* bars chart */
        .bars {
            margin: 14px 0
        }

        .brow {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 7px 0
        }

        .brow .bl {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--dim);
            width: 110px;
            text-align: right;
            flex-shrink: 0
        }

        .brow .btrack {
            flex: 1;
            height: 18px;
            background: var(--bg3);
            border: 1px solid var(--line);
            border-radius: 2px;
            overflow: hidden
        }

        .brow .bfill {
            height: 100%;
            background: rgba(230, 57, 70, .45);
            border-right: 1px solid var(--acc)
        }

        .brow .bv {
            font-family: var(--mono);
            font-size: 10.5px;
            color: #C4CCD4;
            width: 64px;
            flex-shrink: 0
        }

        .segbar {
            display: flex;
            height: 26px;
            border: 1px solid var(--line2);
            border-radius: 3px;
            overflow: hidden;
            margin: 12px 0
        }

        .segbar>div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-size: 9px;
            color: #0B0D0F;
            font-weight: 600;
            min-width: 0
        }

        .leg {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--dim);
            margin-top: 6px
        }

        .leg span::before {
            content: '';
            display: inline-block;
            width: 9px;
            height: 9px;
            margin-right: 6px;
            vertical-align: -1px
        }

        /* search modal */
        #smodal {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(5, 6, 8, .7);
            backdrop-filter: blur(3px);

        /* =====================================================================
           TRACEVERSE — JUDGE DOCUMENTATION CONSOLE
           Single-file build. All content in DATA section below; edit there.
           ===================================================================== */
        'use strict';
        const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
        const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const icons = () => { try { lucide.createIcons() } catch (e) { } };
        let toastT;
        function toast(msg, icon = 'info') {
            const t = document.createElement('div'); t.className = 'toast';
            t.innerHTML = `<i data-lucide="${icon}"></i><span>${msg}</span>`;
            $('#toasts').appendChild(t); icons();
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; setTimeout(() => t.remove(), 320) }, 2600);
        }
        function copyText(txt, msg = 'Copied to clipboard') {
            const done = () => toast(msg, 'check');
            if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(done).catch(() => fallback()) }
            else fallback();
            function fallback() { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done() } catch (e) { toast('Copy failed', 'x') } ta.remove() }
        }

        /* =====================================================================
           STATUS BADGES
           ===================================================================== */
        const BD = { IMPLEMENTED: 'impl', EXPERIMENTAL: 'exp', MOCK: 'mock', PLANNED: 'plan', DOCUMENTATION: 'doc' };
        const bd = s => `<span class="bd bd-${BD[s] || 'doc'}">${s}</span>`;

        /* =====================================================================
           SHARED BLOCK HELPERS
           ===================================================================== */
        const sec = (id, title, body, tag = '') => `<section class="sec" id="${id}"><div class="sh"><h2>${title}</h2>${tag ? `<span class="tag">${tag}</span>` : ''}<button class="anc" data-anc="${id}" title="Copy section link"><i data-lucide="link-2"></i></button></div>${body}</section>`;
        const tbl = (h, rows, mono = []) => `<div class="tw"><table><thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${mono.includes(i) ? 'mono-cell' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        const code = (t, lang = 'TEXT') => `<div class="code"><div class="ch"><span>${lang}</span><button class="cb" data-copycode title="Copy"><i data-lucide="copy"></i></button></div><pre><code>${esc(t)}</code></pre></div>`;
        const note = (tone, title, body) => `<div class="notice ${tone}"><i data-lucide="${tone === 'limit' ? 'alert-triangle' : tone === 'ok' ? 'shield-check' : tone === 'warn' ? 'flag' : 'info'}"></i><div><div class="nt">${title}</div><p>${body}</p></div></div>`;
        const implCard = o => `<div class="impl-card"><div class="ih"><b>IMPLEMENTATION</b><span class="tag">${bd(o.status)}</span></div>
  <div class="impl-row"><div class="k">COMPONENT</div><div class="v">${o.component}</div></div>
  <div class="impl-row"><div class="k">LOCATION</div><div class="v mono" style="font-size:11.5px">${o.location}</div></div>
  <div class="impl-row"><div class="k">TECHNOLOGY</div><div class="v">${o.tech}</div></div>
  <div class="impl-row"><div class="k">DEPENDENCIES</div><div class="v">${o.deps}</div></div>
  <div class="if"><button class="btn" data-repo><i data-lucide="external-link"></i> OPEN REPOSITORY</button></div></div>`;
        const flowV = (steps) => `<div class="flow">${steps.map((s, i) => `
  ${i > 0 ? `<div class="farrow">↓</div>` : ''}
  <div class="fstep"><div class="fi">${String(i + 1).padStart(2, '0')}</div><div class="fb ${s.p ? 'nav' : ''}" ${s.p ? `data-nav="${s.p}"` : ''}><div class="fk">${s.k}</div>${s.v ? `<div class="fv">${s.v}</div>` : ''}</div></div>`).join('')}</div>`;
        const chips = arr => `<div class="chips">${arr.map(c => `<button class="chip" data-nav="${c[1]}">${c[0]}</button>`).join('')}</div>`;
        const relDocs = arr => sec('related', 'RELATED COMPONENTS', chips(arr));
        const judgePanel = (why, links = []) => `<div class="judge-panel"><div class="jt">JUDGE FOCUS — WHY THIS MATTERS</div><p>${why}</p>${links && links.length ? `<div class="chips">${links.map(l => `<button class="chip" data-nav="${l[1]}">${l[0]}</button>`).join('')}</div>` : ''}</div>`;
        const faqChip = (id, label) => `<button class="chip q" data-faq="${id}">${label}</button>`;
        const judgeQ = ids => sec('judge-q', 'COMMON JUDGE QUESTIONS', `<div class="chips">${ids.map(id => { const f = FAQ.find(x => x.id === id); return faqChip(id, f ? f.q : id) }).join('')}</div>`);
        const kvGrid = pairs => `<div class="kv">${pairs.map(p => `<div><div class="k">${p[0]}</div><div class="v ${p[2] ? 'mono' : ''}">${p[1]}</div></div>`).join('')}</div>`;

        /* =====================================================================
           CORE DATA — VASP REGISTRY, EVIDENCE, DEMO CASE, FAQ
           ===================================================================== */
        const REGISTRY = [
            ['Binance', 'Ethereum', '0xD55123…3C07', 'hot wallet · deposit cluster', 'official published wallet list', 'TIER-1', 'verified against operator disclosure'],
            ['OKX', 'Ethereum', '0x3F76A9…92B1', 'hot wallet', 'provider address catalog + official list', 'TIER-1', 'verified'],
            ['KuCoin', 'Ethereum', '0x69ACC3…4E55', 'deposit address', 'provider address catalog', 'TIER-2', 'single-source, re-verification pending'],
            ['Unattributed cluster', 'Ethereum', '0x2Cc94D…17AF', '—', '—', '—', 'no registry match; scored as unknown endpoint'],
        ];

        const EVIDENCE = [
            { id: 'E-1041', type: 'TRANSACTION', hash: '0x4e77a1…21c9', from: '0x7A25…9D41 (reported)', to: '0x51B0…2F9A', amt: '10,000.00 USDT', ts: '2024-11-01T09:12:44Z', hop: 1, src: 'blockchain_provider', supports: ['PATH-01', 'RISK:RAPID_PASS_THROUGH'] },
            { id: 'E-1042', type: 'TRANSACTION', hash: '0x9c18f3…b7e2', from: '0x51B0…2F9A', to: '0x9E4c…77B3', amt: '8,150.00 USDT', ts: '2024-11-01T09:19:02Z', hop: 2, src: 'blockchain_provider', supports: ['PATH-01', 'RISK:LAYERING'] },
            { id: 'E-1043', type: 'TRANSACTION', hash: '0x2b90de…04fa', from: '0x9E4c…77B3', to: '0xD551…3C07 (Binance)', amt: '8,020.00 USDT', ts: '2024-11-01T09:26:38Z', hop: 3, src: 'blockchain_provider', supports: ['ATTRIBUTION:BINANCE', 'PATH-01'] },
            { id: 'E-1044', type: 'REGISTRY', hash: '—', from: '—', to: '0xD551…3C07', amt: '—', ts: '—', hop: '—', src: 'vasp_registry', supports: ['ATTRIBUTION:BINANCE'], reg: 'Binance · TIER-1 · official published wallet list' },
            { id: 'E-1045', type: 'SCORE', hash: '—', from: '—', to: 'candidate: BINANCE', amt: 'score 90.0', ts: '—', hop: '—', src: 'attribution_engine', supports: ['ATTRIBUTION:BINANCE'], reg: 'prox 29.8 · flow 23.0 · freq 19.2 · behav 9.5 · recency 8.5' },
            { id: 'E-1046', type: 'TRANSACTION', hash: '0x7f33c8…9d10', from: '0x33Fa…08D2', to: '0x6D92…5A1E, 0xB7e8…C490, +4 outputs', amt: '6 × 1,300.00 USDT', ts: '2024-11-01T09:44:11Z', hop: 2, src: 'blockchain_provider', supports: ['RISK:FAN_OUT'] },
        ];

        function evCard(e) {
            return `<div class="evcard" data-ev><div class="evhead" data-evhead>
    <span class="eid">${e.id}</span><span class="ehash mono">${e.hash}</span>${bd(e.type === 'REGISTRY' || e.type === 'SCORE' ? 'DOCUMENTATION' : 'IMPLEMENTED')}
    <i data-lucide="chevron-right" class="chev"></i></div>
    <div class="evbody"><div class="evgrid">
      <div><div class="k">TRANSACTION</div><div class="v">${e.hash}</div></div>
      <div><div class="k">FROM</div><div class="v">${e.from}</div></div>
      <div><div class="k">TO</div><div class="v">${e.to}</div></div>
      <div><div class="k">AMOUNT</div><div class="v">${e.amt}</div></div>
      <div><div class="k">TIMESTAMP</div><div class="v">${e.ts}</div></div>
      <div><div class="k">HOP</div><div class="v">${e.hop}</div></div>
      <div><div class="k">SOURCE</div><div class="v">${e.src}</div></div>
      ${e.reg ? `<div><div class="k">DETAIL</div><div class="v">${e.reg}</div></div>` : ''}
      <div><div class="k">SUPPORTS</div><div class="v">${e.supports.join(' · ')}</div></div>
    </div><div class="evactions">
      <button class="btn" data-nav="analytics/graph"><i data-lucide="git-fork"></i> VIEW ON GRAPH</button>
      <button class="btn" data-nav="evidence/explainability"><i data-lucide="git-branch"></i> VIEW REASONING CHAIN</button>
      <button class="btn" data-nav="analytics/attribution"><i data-lucide="crosshair"></i> VIEW SCORE CONTEXT</button>
    </div></div></div>`;
        }

        const FAQ = [
            { id: 'what-does-it-do', cat: 'PRODUCT', q: 'What exactly does TRACEVERSE do?', a: `It converts a victim-reported suspect wallet address into an evidence-linked investigation package: on-chain funds are traced within a bounded hop depth, likely VASP exit points are ranked with a decomposable score, risk indicators are derived from graph patterns, and every conclusion is bound to transaction-level evidence records.`, rel: [['Overview', 'overview'], ['Evidence Model', 'evidence/model']] },
            { id: 'who-for', cat: 'PRODUCT', q: 'Who is the intended user?', a: `Fraud investigators, exchange compliance teams and law-enforcement analysts who receive a victim report and need a defensible, auditable starting point for asset-tracing and freezing actions — not a trading or consumer tool.`, rel: [['Problem → Solution', 'overview-problem']] },
            { id: 'data-source', cat: 'BLOCKCHAIN', q: 'Where does your blockchain data come from?', a: `From public blockchains via an EVM-compatible REST indexer API (Etherscan-style), queried server-side. Raw responses are normalized into an internal transaction model before any analysis runs. The provider is a pluggable client — swapping indexers requires no change to analytics.`, rel: [['Blockchain Sources', 'data/sources']] },
            { id: 'chains', cat: 'BLOCKCHAIN', q: 'Which chains are supported?', a: `Ethereum mainnet, including ERC-20 token transfers (USDT is the demo asset), is implemented. Additional EVM chains, Tron (USDT-TRC20) and Bitcoin UTXO tracing are <b>PLANNED</b> — the normalizer and graph layers are chain-agnostic by design, but only the Ethereum path is implemented today.`, rel: [['Blockchain Sources', 'data/sources'], ['MVP vs Future', 'validation/mvp']] },
            { id: 'tokens', cat: 'BLOCKCHAIN', q: 'Only native ETH, or tokens too?', a: `Both. Native transfers and ERC-20 <span class="mono">Transfer</span> events are fetched and normalized into the same transaction model, so token flows appear as first-class edges in the graph.`, rel: [['Normalization', 'data/normalization']] },
            { id: 'bridges', cat: 'BLOCKCHAIN', q: 'Can you trace across bridges?', a: `Not in the current build. A bridge exit appears as a terminal, unattributed endpoint — the report says so explicitly rather than guessing. Cross-chain hop resolution is <b>FUTURE</b> work.`, rel: [['Limitations', 'validation/limitations']] },
            { id: 'stack', cat: 'ARCHITECTURE', q: 'What is the stack?', a: `A single-page frontend, a FastAPI (Python) backend, PostgreSQL for case/analysis persistence, and a server-side blockchain provider client. No message queue in the MVP — analyses run synchronously per request; the queue+worker topology is documented as the production architecture.`, rel: [['Architecture', 'system-architecture'], ['Scalability', 'engineering/scalability']] },
            { id: 'mono-vs-micro', cat: 'ARCHITECTURE', q: 'Monolith or microservices?', a: `A modular monolith: trace, attribution, risk and evidence are separate modules with narrow interfaces, so they can be extracted into workers without rewriting analytics. For the demo scale, one deployable is the honest engineering choice.`, rel: [['Backend', 'engineering/backend']] },
            { id: 'why-bfs', cat: 'ALGORITHMS', q: 'Why BFS instead of DFS?', a: `Laundering distance is measured in hops, and BFS explores the graph exactly hop-layer by hop-layer. That gives us: (1) nearest endpoints discovered first, matching "where did the money go first" intuition; (2) a hard, predictable bound on work — O(branching^depth); (3) natural MAX_HOPS semantics judges and investigators can reason about. DFS would dive deep along one path before checking a cheaper alternative, with unbounded stack depth.`, rel: [['BFS Tracing', 'analytics/bfs'], ['Scalability', 'engineering/scalability']] },
            { id: 'cycles', cat: 'ALGORITHMS', q: 'How do you handle cycles (A→B→A)?', a: `A visited set prevents re-expansion of any address. The cyclical edge is still recorded as evidence in the graph, but the node is never enqueued twice — termination is guaranteed even on deliberately cyclic laundering patterns.`, rel: [['BFS Tracing', 'analytics/bfs']] },
            { id: 'traversal-limits', cat: 'ALGORITHMS', q: 'What are the traversal limits?', a: `MAX_HOPS = 3 (configurable per analysis), a hard node cap of 200, and a per-node transaction fetch cap. Any limit that truncates a trace is recorded in the analysis result as a data-quality gap and surfaced in the report — silent truncation is treated as a bug.`, rel: [['BFS Tracing', 'analytics/bfs'], ['Reliability', 'engineering/reliability']] },
            { id: 'how-identify-exchange', cat: 'VASP ATTRIBUTION', q: 'How do you identify the exchange?', a: `Two mechanisms: (1) direct registry match — traced endpoints are checked against a curated VASP address registry with provenance tiers; (2) weighted scoring for ranking candidates: proximity 35%, flow 25%, frequency 20%, behaviour 10%, recency 10%. Every component of the score is separately inspectable and backed by evidence items.`, rel: [['VASP Attribution', 'analytics/attribution'], ['VASP Registry', 'data/registry']] },
            { id: 'unknown-vasp', cat: 'VASP ATTRIBUTION', q: 'What if the endpoint is not a known VASP?', a: `It stays in the candidate list as an explicitly labeled <b>unattributed endpoint</b>, scored on the same factors minus the registry component. We never force a label onto an unknown address — an honest "unknown" is more useful to an investigator than a confident guess.`, rel: [['VASP Registry', 'data/registry'], ['Limitations', 'validation/limitations']] },
            { id: 'false-positives', cat: 'VASP ATTRIBUTION', q: 'Could you produce a false positive?', a: `Yes — that is why the score is explicitly defined as strength of on-chain association, not proof of ownership. Shared hot-wallet infrastructure can inflate proximity. Mitigations: registry verification tiers, decomposable scoring so an analyst can see which factor drives the rank, and evidence links for every component. Known residual risk is documented on the Limitations page.`, rel: [['VASP Attribution', 'analytics/attribution'], ['Limitations', 'validation/limitations']] },
            { id: 'where-ai', cat: 'ML', q: 'Where is the AI?', a: `A gradient-boosted tree classifier (scikit-learn <span class="mono">HistGradientBoosting</span>) predicts whether a traced endpoint behaves like a VASP deposit cluster, from features such as counterparty counts, value distribution, in/out ratio and taint share. Its output feeds the 10% behaviour component of attribution. It is <b>EXPERIMENTAL</b> and never the sole basis for a conclusion — deterministic rules and registry evidence carry the verdicts.`, rel: [['ML / AI Evaluation', 'analytics/ml']] },
            { id: 'why-not-all-ml', cat: 'ML', q: 'Why not use ML for everything?', a: `Three reasons: auditability (a regulator must be able to re-derive a conclusion — a score decomposition does that, a model output alone does not), data scarcity (labeled fraud-tracing data is small; rules are transparent where data is thin), and failure legibility (when a rule is wrong, you can see which threshold failed). ML is used exactly where learned patterns beat hand-written ones: behavioural classification.`, rel: [['ML / AI Evaluation', 'analytics/ml']] },
            { id: 'ml-validation', cat: 'ML', q: 'How did you validate the model?', a: `Stratified 70/15/15 train/validation/test split over a labeled address set (published VASP deposit addresses as positives, sampled regular addresses as negatives). We report accuracy, precision, recall, F1, macro-F1 and top-3 against a logistic-regression baseline. Full numbers and honest scope caveats are on the ML page.`, rel: [['ML / AI Evaluation', 'analytics/ml']] },
            { id: 'move-funds', cat: 'SECURITY', q: 'Can your platform steal or move funds?', a: `No — and it cannot by construction. TRACEVERSE is strictly read-only analytics: no private keys, no seed phrases, no transaction signing, no wallet custody, no transfer functionality exists anywhere in the codebase. The only thing that ever leaves the system is a read query to a public blockchain API.`, rel: [['Security', 'engineering/security']] },
            { id: 'api-keys', cat: 'SECURITY', q: 'Where are API keys stored?', a: `Server-side only, injected via environment variables into the backend. The frontend never sees provider credentials — all blockchain queries are proxied through our API. The demo build uses a backend-configured key; production adds a secrets manager.`, rel: [['Security', 'engineering/security']] },
            { id: 'auth', cat: 'SECURITY', q: 'Is there authentication?', a: `Not in the demo build — it is a single-operator demonstration deployment and we label it as such rather than implying multi-user security that isn't there. Authentication, RBAC and audit logging are on the production roadmap. Input validation, server-side secrets and basic rate limiting are implemented today.`, rel: [['Security', 'engineering/security'], ['Deployment', 'deployment/architecture']] },
            { id: 'scale-national', cat: 'SCALABILITY', q: 'What happens if this is deployed nationally?', a: `The MVP topology (one API + one DB + external providers) would hit provider rate limits first — that is the honest bottleneck. The documented production architecture moves to a queue with horizontal trace workers, our own chain indexing to remove provider dependence, Redis caching, and PostgreSQL read replicas. Each stage is scoped on the Scalability page.`, rel: [['Scalability', 'engineering/scalability'], ['Production Roadmap', 'deployment/roadmap']] },
            { id: 'prove-it', cat: 'EVIDENCE', q: 'How do you prove the attribution?', a: `We don't claim mathematical proof — we produce an auditable chain: candidate → score decomposition (five weighted factors) → per-factor evidence records → raw transaction hashes, amounts, timestamps and registry provenance. An analyst can independently verify every link on a block explorer. The report states association strength, never ownership.`, rel: [['Evidence Model', 'evidence/model'], ['Explainability', 'evidence/explainability']] },
            { id: 'deployable', cat: 'DEPLOYMENT', q: 'Can this actually be deployed?', a: `Yes, at demonstration scope today: the backend is a standard containerized FastAPI service with a PostgreSQL dependency and one provider key — deployable to any VM. National-scale deployment requires the production architecture (queue, workers, own indexing), which is specified but not built. We keep that distinction explicit.`, rel: [['Deployment Architecture', 'deployment/architecture'], ['Scalability', 'engineering/scalability']] },
            { id: 'business-model', cat: 'BUSINESS', q: 'Who pays for this?', a: `Exchange compliance departments, licensed VASPs with regulatory tracing obligations, and law-enforcement/financial-intelligence units. Value proposition: investigation hours per case drop from days of manual explorer work to a bounded, evidence-linked first pass. Delivery: SaaS for compliance teams, on-prem/private deployment for agencies.`, rel: [['Business / Impact', 'judge/business']] },
            { id: 'impact', cat: 'IMPACT', q: 'What is the real-world impact?', a: `Speed-to-freeze is the decisive variable in crypto fraud recovery — funds that reach a VASP with a freezing request in hours are recoverable; after layering and off-ramping, they usually are not. A tool that compresses attribution from days to minutes directly changes recovery outcomes, and every conclusion arriving with attached evidence shortens the legal path from suspicion to action.`, rel: [['Business / Impact', 'judge/business'], ['Problem → Solution', 'overview-problem']] },

 ${ judgePanel('"Why BFS?" — answer in one line: laundering distance is measured in hops, and BFS explores exactly hop-layer by hop-layer, so nearest endpoints surface first under a hard, predictable work bound. Then play the animation.', [['GRAPH ENGINE', 'analytics/graph'], ['SCORING', 'analytics/attribution']]) }

 ${
            sec('pseudo', 'PSEUDOCODE', code(`INPUT  : start_address, MAX_HOPS = 3, MAX_NODES = 200
QUEUE  : FIFO [(start_address, hop = 0)]
VISITED: {start_address}
ENDPOINTS: []

while QUEUE not empty and |VISITED| < MAX_NODES:

    (current, hop) = QUEUE.dequeue()
    if hop >= MAX_HOPS:
        continue                      # depth bound

    txs = provider.get_outbound(current)   # normalized transactions

    for tx in txs:
        record_edge(current -> tx.receiver, tx)

        if is_known_vasp(tx.receiver):
            ENDPOINTS.add(tx.receiver)     # terminal: NEVER expanded
            continue

        if tx.receiver not in VISITED:
            VISITED.add(tx.receiver)
            QUEUE.enqueue((tx.receiver, hop + 1))

return graph, ENDPOINTS`, 'PSEUDOCODE'))
        }

/* =====================================================================

function buildIndex(){
  const idx=[];
  GROUPS.forEach(g=>g.items.forEach(([n,slug,title])=>{
    const p=P[slug];idx.push({t:title,sub:p?p.kick:'',path:slug,cat:'PAGES',k:(title+' '+(p?p.kick:'')).toLowerCase()});
  }));
  FAQ.forEach(f=>idx.push({t:f.q,sub:f.a.replace(/<[^>]+>/g,'').slice(0,110)+'…',path:'judge/rapid',anchor:'faq-'+f.id,cat:'QUESTIONS',k:(f.q+' '+f.cat).toLowerCase()}));
  [['POST /analyze','start an analysis','engineering/api'],['GET /analysis/{id}','analysis status + summary','engineering/api'],['GET /graph','graph snapshot','engineering/api'],['GET /transactions','normalized transactions','engineering/api'],['GET /attributions','ranked candidates','engineering/api'],['GET /evidence','evidence records','engineering/api'],['POST /report','assemble case report','engineering/api'],
   ['Proximity factor 35%','attribution scoring component','analytics/attribution'],['Flow factor 25%','attribution scoring component','analytics/attribution'],['Frequency factor 20%','attribution scoring component','analytics/attribution'],['Behaviour factor 10%','attribution + ML prior','analytics/attribution'],['Recency factor 10%','attribution scoring component','analytics/attribution'],
   ['Layering rule','risk engine signal','analytics/risk'],['Rapid pass-through rule','risk engine signal','analytics/risk'],['Fan-out rule','risk engine signal','analytics/risk'],['Tx density rule','risk engine signal','analytics/risk'],
   ['MAX_HOPS','traversal depth bound','analytics/bfs'],['Visited set','cycle immunity','analytics/bfs'],['HistGradientBoosting','GBT classifier','analytics/ml'],['EIP-55','address checksum','data/validation'],
  ].forEach(x=>idx.push({t:x[0],sub:x[1],path:x[2],cat:'API · ALGORITHMS · SCHEMA',k:(x[0]+' '+x[1]).toLowerCase()}));
  return idx;
}
let SEARCH_IDX=[],curResults=[],curSel=0;
function openSearch(){$('#smodal').classList.add('open');$('#sinput').value='';$('#sinput').focus();runSearch('')}
function closeSearch(){$('#smodal').classList.remove('open')}
function runSearch(q){
  q=q.trim().toLowerCase();curSel=0;
  curResults=q?SEARCH_IDX.filter(x=>(x.t+' '+x.sub+' '+x.k).toLowerCase().includes(q)).slice(0,14):SEARCH_IDX.filter(x=>x.cat==='PAGES').slice(0,8);
  let html='',lastCat='';
  curResults.forEach((r,i)=>{
    if(r.cat!==lastCat){html+=`<div class="sgroup" > ${ r.cat }</div> `;lastCat=r.cat}
    html+=`<button class="sitem ${i===curSel?'cur':''}" data-sres="${i}" ><span class="st">${r.t}<small>${r.sub}</small></span><span class="sp">${r.path}</span></button> `;
  });
  $('#sres').innerHTML=html;
}
function pickResult(i){
  const r=curResults[i];if(!r)return;
  closeSearch();
  go(r.path,r.anchor);
}

/* =====================================================================

   ===================================================================== */
let bfsCtl=null;
function go(path,anchor){
  if(anchor) location.hash='#/'+path+'/'+anchor;
  else location.hash='#/'+path;
}
function currentRoute(){
  const h=location.hash.replace(/^#\/?/,'');
  const seg=h.split('/').filter(Boolean);
  return {path:seg.slice(0,2).join('/'),anchor:seg[2]||null};
}
function render(){
  if(bfsCtl){bfsCtl.stop();bfsCtl=null}
  const {path,anchor}=currentRoute();
  const key=P[path]?path:'overview';
  const page=P[key];
  window._archSel=window._archSel||'analytics';
  const html=page.render();
  $('#content').innerHTML=`
            <div class="crumbs" > ${ esc(page.crumb) } &nbsp; /&nbsp; <b>${esc(page.title)}</b></div>
                <div class="page-head"><div class="row1"><h1>${esc(page.title)}</h1>
                    <button class="copylink" data-copylink="${key}"><i data-lucide="copy"></i> COPY LINK</button></div>
                    <div class="page-kick">${page.kick}</div>
                    <div class="page-meta">${(page.badges || []).map(b => bd(b[0])).join('')}</div></div>
  ${ html } `;
  // breadcrumbs in header
  $('#hcrumb').textContent='TRACEVERSE / JUDGE DOC / '+page.title.slice(0,44);
  // sidebar active
  $$('.sb-item').forEach(a=>a.classList.toggle('active',a.dataset.nav===key));
  const act=$('.sb-item.active');if(act)act.scrollIntoView({block:'nearest'});
  // right rail
  const secs=$$('#content section.sec');
  $('#railnav').innerHTML=secs.map(s=>`<a class="rail-item" href = "#/${key}/${s.id}" data-rail="${s.id}" > ${ s.querySelector('h2').textContent }</a> `).join('');
  // scroll
  if(anchor){
    requestAnimationFrame(()=>{
      const t=document.getElementById(anchor);
      if(t){t.scrollIntoView({behavior:'smooth',block:'start'});
        if(t.dataset.faqitem)$('#'+anchor+' > .fq')?.click();}
    });
  } else window.scrollTo({top:0,behavior:'instant'});
  // page-specific bindings
  if(key==='analytics/graph')bindGraphViz();
  if(key==='judge/map')bindMap();
  if(key==='analytics/bfs')bfsCtl=bindBFS('bfs');
  if(key==='demo/case'){$('#rundemo').onclick=()=>{const host=$('#demoviz');host.innerHTML=bfsVizHTML('dm');icons();bfsCtl=bindBFS('dm');bfsCtl._play&&bfsCtl._play();toast('Replaying demo trace — CT-DEMO-001','play');
    // auto-play
    const pb=$('#dmplay');if(pb)pb.click();}
    // expose play for demo
    const _bind=bindBFS;}
  if(key==='system-architecture')renderArchDetail();
  if(key==='judge/rapid'){const f=$('#faqfilter');if(f)f.addEventListener('input',()=>{
    const q=f.value.toLowerCase();
    $$('#faqbank .fitem').forEach(it=>{it.style.display=it.textContent.toLowerCase().includes(q)?'':'none'})});}
  icons();
  setupSpy();
}
function renderArchDetail(){
  const a=ARCH.find(x=>x.id===window._archSel)||ARCH[2];
  $('#archdetail').innerHTML=`<div class="ad-t" > ${ a.t } ${ bd(a.badge) }</div> `+
    Object.entries(a.d).map(([k,v])=>`<div class="ad-row" ><div class="ad-k">${k.toUpperCase()}</div><div class="ad-v">${v}</div></div> `).join('');
}
function bindMap(){
  const insp=$('#mapinsp');
  const show=n=>{insp.innerHTML=`<div class="mi-t" > ${ n.t }</div>
    <div class="mi-r"><div class="mi-k">PURPOSE</div><div class="mi-v">${n.p}</div></div>
    <div class="mi-r"><div class="mi-k">INPUT</div><div class="mi-v">${n.i}</div></div>
    <div class="mi-r"><div class="mi-k">OUTPUT</div><div class="mi-v">${n.o}</div></div>
    <div class="mi-r"><div class="mi-k">IMPLEMENTATION</div><div class="mi-v">${n.m}</div></div>
    <button class="btn primary" data-nav="${n.path}" style="margin-top:4px"><i data-lucide="arrow-right"></i> VIEW DETAILS</button>`;icons();};
  $$('[data-mapnode]').forEach(g=>{
    const n=MAP_NODES.find(x=>x.id===g.dataset.mapnode);
    g.addEventListener('mouseenter',()=>show(n));
    g.addEventListener('focus',()=>show(n));
    g.addEventListener('click',()=>{show(n);go(n.path)});
  });
}
let spy=null;
function setupSpy(){
  if(spy)spy.disconnect();
  const secs=$$('#content section.sec');
  if(!secs.length)return;
  spy=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){
      $$('.rail-item').forEach(r=>r.classList.toggle('active',r.dataset.rail===e.target.id))}})
  },{rootMargin:'-70px 0px -60% 0px'});
  secs.forEach(s=>spy.observe(s));
}

document.addEventListener('keydown',e=>{
  const typing=/input|textarea/i.test(document.activeElement.tagName);
  if((e.key==='/'&&!typing)||(e.key.toLowerCase()==='k'&&(e.metaKey||e.ctrlKey))){e.preventDefault();openSearch();return}
  if(e.key==='Escape'){closeSearch();return}
  if($('#smodal').classList.contains('open')){
    if(e.key==='ArrowDown'){e.preventDefault();curSel=Math.min(curSel+1,curResults.length-1);runSearch($('#sinput').value);highlightSel()}
    if(e.key==='ArrowUp'){e.preventDefault();curSel=Math.max(curSel-1,0);runSearch($('#sinput').value);highlightSel()}
    if(e.key==='Enter'){pickResult(curSel)}
    return;
  }
  const {path}=currentRoute();
  if(path==='demo/route'&&/^[1-7]$/.test(e.key)){
    const map=['data/validation','analytics/bfs','analytics/graph','analytics/attribution','analytics/risk','evidence/model','evidence/reports'];
    go(map[+e.key-1]);
  }
});
function highlightSel(){$$('.sitem').forEach((el,i)=>el.classList.toggle('cur',i===curSel))}
 $('#sinput').addEventListener('input',e=>runSearch(e.target.value));
